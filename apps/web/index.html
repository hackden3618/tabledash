<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport ─────────────────────────────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- ── Favicons & App Icons ──────────────────────────────────────────────── -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apple: static icon so "Add to Home Screen" gets the real icon, not a screenshot -->
    <link rel="apple-touch-icon" href="/ladha_icon_customer.png" />

    <!-- ── PWA Manifest ───────────────────────────────────────────────────────
         Static default so browsers detect installability BEFORE React runs.
         manifestSwitcher.ts swaps this to manifest-kitchen.webmanifest for
         kitchen sessions at runtime.
    ─────────────────────────────────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest-customer.webmanifest" />

    <!-- ── Apple PWA meta ────────────────────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ladha" />

    <!-- ── Theme color (JS swaps this for kitchen sessions) ─────────────────── -->
    <meta name="theme-color" content="#0B1E13" />

    <!-- ── Primary SEO ───────────────────────────────────────────────────────── -->
    <title>Ladha — Free Food Delivery in Kenya | Local Hotel &amp; Kitchen Food</title>
    <meta name="description" content="Order fresh local food from trusted hotels and kitchens near you in Kenya. Free food delivery in your area — market stalls, offices and homes. Track your order live." />
    <meta name="keywords" content="food delivery Kenya, free food delivery Kenya, local food near me, order food online Kenya, hotel food delivery, local hotels Naivasha, restaurant delivery Kenya, kitchen delivery Kiambu, market stall food, fresh meals Kenya, Ladha food delivery" />
    <link rel="canonical" href="https://ladha.co.ke" id="ladha-canonical" />

    <!-- ── Open Graph (Facebook, WhatsApp link previews) ───────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ladha" />
    <meta property="og:title" content="Ladha — Free Food Delivery in Kenya | Local Hotel &amp; Kitchen Food" />
    <meta property="og:description" content="Order fresh local food from trusted hotels and kitchens near you. Free food delivery in your area across Kenya — track your order live." />
    <meta property="og:image" content="https://ladha.co.ke/ladha_icon_customer.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Ladha — fresh food delivered fast" />
    <meta property="og:url" content="https://ladha.co.ke" />
    <meta property="og:locale" content="en_KE" />

    <!-- ── Twitter Card ──────────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ladha — Free Food Delivery in Kenya" />
    <meta name="twitter:description" content="Order from trusted local hotels and kitchens near you. Free food delivery across Kenya." />
    <meta name="twitter:image" content="https://ladha.co.ke/ladha_icon_customer.png" />

    <!-- ── Geo / Language targeting ─────────────────────────────────────────── -->
    <meta name="geo.region" content="KE" />
    <meta name="geo.placename" content="Kenya" />
    <meta http-equiv="content-language" content="en-KE" />

    <!-- ── Robots ────────────────────────────────────────────────────────────── -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- ── JSON-LD Structured Data — Food service marketplace ────────────────
         Helps Google understand Ladha is a food delivery marketplace connecting
         customers with local hotels/kitchens, and surface it in "food delivery
         near me" rich results. Free delivery is real: a hotel's own delivery
         area is free by default (resolveDeliveryFee returns 0 for the hotel's
         own town region).
    ─────────────────────────────────────────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FoodEstablishment",
      "@id": "https://ladha.co.ke/#organization",
      "name": "Ladha",
      "alternateName": "Ladha Deliveries",
      "description": "Kenya's local food delivery marketplace — fresh meals from trusted hotels and kitchens delivered to market stalls, offices and homes, with free delivery in the hotel's area.",
      "url": "https://ladha.co.ke",
      "logo": "https://ladha.co.ke/ladha_icon_customer.png",
      "image": "https://ladha.co.ke/ladha_icon_customer.png",
      "areaServed": {
        "@type": "Country",
        "name": "Kenya"
      },
      "servesCuisine": ["Local Kenyan", "African", "Fast Food", "Grilled", "Swahili"],
      "priceRange": "KSh 100 - KSh 2000",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Food delivery services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Free food delivery in your area",
              "description": "Free delivery within a hotel's own delivery area — market stalls, offices and homes.",
              "areaServed": { "@type": "Country", "name": "Kenya" }
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Local hotel & kitchen meals",
              "description": "Fresh meals ordered online from trusted local hotels and kitchens.",
              "areaServed": { "@type": "Country", "name": "Kenya" }
            }
          }
        ]
      },
      "sameAs": []
    }
    </script>

    <!-- ── Google Fonts ──────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── Boot splash — critical, inlined so it paints before any JS runs.
         This is the "you tapped the right thing, good food is coming"
         moment, not a technical loading screen. Frame timings match the
         brand spec: icon at 0ms, wordmark+tagline at 500ms, and main.tsx
         (below) adds the "Preparing your menu…" phase once mounted, then
         removes this node entirely.
    ─────────────────────────────────────────────────────────────────────────── -->
    <style>
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0B1E13;
        transition: opacity 0.35s ease;
      }
      #boot-splash.boot-splash--kitchen { background: #9A3412; }
      #boot-splash.boot-splash--hide { opacity: 0; pointer-events: none; }
      #boot-splash-icon {
        width: 92px; height: 92px; border-radius: 20px; display: block;
        opacity: 0; transform: translateY(8px);
        animation: bootFadeUp 0.55s ease-out forwards;
      }
      #boot-splash-brand {
        margin-top: 16px; text-align: center;
        opacity: 0; animation: bootFadeUp 0.5s ease-out forwards; animation-delay: 0.5s;
      }
      #boot-splash-word {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 2rem; font-weight: 800; color: #F7F1E7; letter-spacing: -0.01em;
      }
      #boot-splash-tagline { margin-top: 2px; font-size: 0.85rem; font-style: italic; color: #E3B24A; }
      #boot-splash-message {
        margin-top: 30px; text-align: center;
        opacity: 0; animation: bootFadeUp 0.4s ease-out forwards; animation-delay: 0.15s;
      }
      #boot-splash-message p { font-size: 0.82rem; color: #C9D6CC; margin: 0 0 10px; }
      #boot-splash-dots { display: flex; gap: 6px; justify-content: center; }
      #boot-splash-dots span {
        width: 6px; height: 6px; border-radius: 50%; background: #E3B24A; opacity: 0.35;
        animation: bootDotPulse 1.2s ease-in-out infinite;
      }
      #boot-splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      #boot-splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes bootFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes bootDotPulse { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img id="boot-splash-icon" src="/ladha_icon_customer.png" alt="" />
      <div id="boot-splash-brand">
        <div id="boot-splash-word">Ladha</div>
        <div id="boot-splash-tagline">Taste the moment.</div>
      </div>
      <div id="boot-splash-message" hidden>
        <p id="boot-splash-message-text">Preparing your menu…</p>
        <div id="boot-splash-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script>
      // Runs synchronously before React — themes the splash for kitchen
      // routes immediately, so kitchen staff never see the customer-green
      // shell even for a single frame.
      (function () {
        if (location.pathname.indexOf("/kitchen") === 0) {
          var el = document.getElementById("boot-splash");
          el.className = "boot-splash--kitchen";
          document.getElementById("boot-splash-icon").src = "/ladha_icon_kitchen.png";
          document.getElementById("boot-splash-word").textContent = "Ladha Kitchen";
          document.getElementById("boot-splash-tagline").textContent = "Order console";
          document.getElementById("boot-splash-message-text").textContent = "Loading your orders…";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
